; Supervisor: install on the application host after adjusting PHP and project paths.
[program:spj-compile]
command=/usr/bin/php /var/www/spj-opd/artisan queue:work spj_compile --queue=spj-compile --sleep=3 --tries=1 --timeout=3600 --memory=512 --max-jobs=1
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/spj-compile-worker.log
stopwaitsecs=3660
