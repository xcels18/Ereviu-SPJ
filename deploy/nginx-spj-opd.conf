server {
    listen 80;
    # Ganti dengan IP NUC di jaringan lokal, contoh: 192.168.1.50
    server_name _;

    root /var/www/spj-opd/public;
    index index.php;

    client_max_body_size 60M;   # >10MB per file x beberapa file upload SPJ

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/spj-opd-access.log;
    error_log  /var/log/nginx/spj-opd-error.log;
}
